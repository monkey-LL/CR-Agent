[project]
name = "cr-agent"
version = "0.2.0"
description = "Production-ready AI Code Review Agent with LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "structlog>=24.0",
    "PyYAML>=6.0",
    "tiktoken>=0.7",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "fakeredis>=2.0",
]

[tool.setuptools.packages.find]
include = ["cr_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "BLE001",   # Blind exception (intentional in production fallback paths)
    "PLW1510",  # subprocess.run without check (we handle exit codes manually)
    "DTZ005",   # datetime.now without tz (not critical for internal timestamps)
    "S110",     # try-except-pass (intentional in parsing fallbacks)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
