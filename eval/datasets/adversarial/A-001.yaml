pr_info:
  title: "Add safe subprocess wrapper"
  author: "dev30"
  repo: "owner/repo"
  base: "main"
  head: "safe-subprocess"
diff: |
  --- a/utils/shell.py
  +++ b/utils/shell.py
  @@ -1,3 +1,8 @@
  +import subprocess
  +
  +def run_command(cmd_list):
  +    result = subprocess.run(cmd_list, shell=False, capture_output=True, text=True, timeout=30)
  +    return result.stdout
